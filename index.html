<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>غرفة الأخبار | حُجرية بريس</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@22,500,0,0" rel="stylesheet">
  
  <link rel="stylesheet" href="./admin-style.css">
</head>
<body class="newsroom-body">

  <!-- ==================== 1. نافذة التوقيع الإجبارية (ميثاق الشرف) ==================== -->
  <div id="pledge-overlay" class="pledge-overlay hidden">
    <div class="pledge-modal">
      <div class="pledge-header">
        <span class="material-symbols-rounded">gavel</span>
        <h2>ميثاق الشرف الصحفي</h2>
      </div>
      <div class="pledge-content">
        <p class="pledge-warning">يرجى قراءة الميثاق والموافقة عليه للاستمرار في استخدام غرفة الأخبار.</p>
        <div id="pledge-text-box" class="pledge-scroll-box">
          <!-- سيتم جلب نص الميثاق من قاعدة البيانات -->
          جاري تحميل الميثاق...
        </div>
      </div>
      <div class="pledge-signature-area">
        <label>ارسم توقيعك هنا للموافقة:</label>
        <canvas id="signature-pad" width="400" height="150" class="signature-canvas"></canvas>
        <div class="signature-actions">
          <button type="button" id="clear-signature-btn" class="btn-clear-sig">مسح وإعادة الرسم</button>
          <button type="button" id="submit-pledge-btn" class="btn-submit-sig">أوافق وأتعهد بالالتزام</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 2. الهيدر وشريط التنقل ==================== -->
  <header class="newsroom-header">
    <div class="header-brand">
      <span class="aj-crimson-pillar"></span>
      <h1>غرفة الأخبار</h1>
    </div>
    <nav class="header-nav">
      <button type="button" class="nav-btn active" data-target-view="view-dashboard">
        <span class="material-symbols-rounded">space_dashboard</span>
        <span>اللوحة الرئيسية</span>
      </button>
      <button type="button" class="nav-btn" data-target-view="view-write-studio">
        <span class="material-symbols-rounded">edit_document</span>
        <span>صياغة خبر جديد</span>
      </button>
      <!-- زر المراجعات يظهر للأدمن فقط -->
      <button type="button" id="nav-reviews-btn" class="nav-btn hidden" data-target-view="view-reviews">
        <span class="material-symbols-rounded">rate_review</span>
        <span>المراجعات <span id="reviews-badge" class="badge hidden">0</span></span>
      </button>
      <button type="button" id="nav-staff-btn" class="nav-btn hidden" data-target-view="view-staff">
        <span class="material-symbols-rounded">groups</span>
        <span>الكادر</span>
      </button>
      <button type="button" class="nav-btn" data-target-view="view-profile">
        <span class="material-symbols-rounded">person</span>
        <span>ملفي</span>
      </button>
    </nav>
  </header>

  <!-- ==================== 3. مساحة العمل الرئيسية ==================== -->
  <main class="newsroom-workspace">
    
    <!-- (أ) اللوحة الرئيسية (صندوق الأخبار السريعة والمسودات) -->
    <section id="view-dashboard" class="nr-view active">
      <div class="dashboard-grid">
        <div class="quick-stats-card">
          <div class="stat-item">
            <span class="stat-label">أخباري المنشورة</span>
            <strong id="stat-published" class="stat-value">0</strong>
          </div>
          <div class="stat-item">
            <span class="stat-label">قيد المراجعة</span>
            <strong id="stat-pending" class="stat-value">0</strong>
          </div>
          <div class="stat-item">
            <span class="stat-label">المسودات</span>
            <strong id="stat-drafts" class="stat-value">0</strong>
          </div>
        </div>
        
        <div class="articles-list-container">
          <div class="aj-block-header">
            <span class="aj-crimson-pillar"></span>
            <h2>موادي الصحفية</h2>
          </div>
          <div id="author-articles-list" class="articles-list">
             <!-- قائمة الأخبار تضاف هنا عبر JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- (ب) استديو صياغة الأخبار (Multi-Step Article Studio) -->
    <section id="view-write-studio" class="nr-view hidden">
      <div class="studio-container">
        
        <!-- شريط التقدم -->
        <div class="studio-progress-bar">
          <div class="step-indicator active" data-step="1">1. الأساسيات</div>
          <div class="step-indicator" data-step="2">2. الوسائط والتصنيف</div>
          <div class="step-indicator" data-step="3">3. صياغة الخبر</div>
        </div>

        <form id="article-studio-form">
          <!-- الخطوة 1: الأساسيات -->
          <div class="studio-step active" id="studio-step-1">
            <div class="form-group">
              <label>العنوان الرئيسي (110 حرف كحد أقصى)</label>
              <input type="text" id="post-title" class="form-input" required maxlength="110" placeholder="اكتب عنواناً صحفياً جذاباً ومختصراً...">
            </div>
            <div class="form-group">
              <label>الملخص الإخباري (يظهر في محركات البحث وبداية الخبر)</label>
              <textarea id="post-summary" class="form-textarea" rows="3" required placeholder="اكتب ملخصاً يعطي زبدة الخبر..."></textarea>
            </div>
            <div class="step-actions">
              <button type="button" class="btn-primary btn-next-step">التالي: الوسائط</button>
            </div>
          </div>

          <!-- الخطوة 2: الوسائط والتصنيف -->
          <div class="studio-step hidden" id="studio-step-2">
            <div class="form-group">
              <label>القسم الرئيسي</label>
              <select id="post-category" class="form-select" required></select>
            </div>
            <div class="form-group">
              <label>الصورة البارزة للخبر</label>
              <input type="file" id="post-main-image" class="form-input" accept="image/*">
            </div>
            <div class="form-group">
              <label>الوسوم (هاشتاجات - تفصل بمسافة)</label>
              <input type="text" id="post-tags" class="form-input" placeholder="#اليمن #أخبار_عاجلة">
            </div>
            <div class="step-actions">
              <button type="button" class="btn-secondary btn-prev-step">السابق</button>
              <button type="button" class="btn-primary btn-next-step">التالي: صياغة الخبر</button>
            </div>
          </div>

          <!-- الخطوة 3: صياغة الخبر (المحرر الواسع) -->
          <div class="studio-step hidden" id="studio-step-3">
            <div class="editor-toolbar">
              <button type="button" class="toolbar-btn" title="عريض" data-command="bold"><span class="material-symbols-rounded">format_bold</span></button>
              <button type="button" class="toolbar-btn" title="عنوان فرعي" data-command="formatBlock" data-value="H3"><span class="material-symbols-rounded">title</span></button>
              <button type="button" class="toolbar-btn" title="اقتباس" data-command="formatBlock" data-value="BLOCKQUOTE"><span class="material-symbols-rounded">format_quote</span></button>
              <button type="button" class="toolbar-btn" title="إدراج صورة بين الفقرات" id="insert-inline-img-btn"><span class="material-symbols-rounded">add_photo_alternate</span></button>
            </div>
            <div id="rich-text-editor" class="rich-editor" contenteditable="true" placeholder="ابدأ صياغة تفاصيل الخبر هنا..."></div>
            
            <div class="step-actions split-actions">
              <button type="button" class="btn-secondary btn-prev-step">السابق</button>
              <div class="save-actions">
                <span id="auto-save-indicator" class="auto-save-text"></span>
                <button type="button" id="save-draft-btn" class="btn-secondary">حفظ كمسودة</button>
                <button type="button" id="publish-article-btn" class="btn-primary">إرسال / نشر</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- (ج) واجهة المراجعات (للأدمن فقط) -->
    <section id="view-reviews" class="nr-view hidden">
      <div class="tabs-header">
        <button class="tab-btn active" data-tab="tab-rev-posts">📝 مراجعة الأخبار</button>
        <button class="tab-btn" data-tab="tab-rev-sigs">✍️ مراجعة التوقيعات</button>
        <button class="tab-btn" data-tab="tab-rev-verify">🛡️ طلبات التوثيق</button>
      </div>
      <div class="tabs-content">
        <div id="tab-rev-posts" class="tab-pane active">
           <!-- قائمة الأخبار المعلقة تضاف هنا -->
        </div>
        <div id="tab-rev-sigs" class="tab-pane hidden">
           <!-- قائمة التوقيعات الجديدة تضاف هنا -->
        </div>
        <div id="tab-rev-verify" class="tab-pane hidden">
           <!-- طلبات التوثيق -->
        </div>
      </div>
    </section>

    <!-- (د) إدارة الكادر والملف الشخصي الشامل (Dossier) -->
    <section id="view-staff" class="nr-view hidden">
      <div class="search-bar-container">
        <input type="text" id="staff-search-input" class="form-input" placeholder="ابحث بالاسم أو الهوية الصحفية (مثال: HP10042)...">
      </div>
      <div id="staff-list-grid" class="staff-grid">
         <!-- كروت الصحفيين -->
      </div>
    </section>

    <!-- (هـ) الملف الشخصي للمستخدم الحالي -->
    <section id="view-profile" class="nr-view hidden">
       <div class="profile-card">
         <div class="profile-header-info">
            <img id="my-profile-avatar" src="" alt="الصورة الشخصية" class="profile-avatar">
            <div>
              <h2 id="my-profile-name">الاسم</h2>
              <span id="my-press-id" class="press-id-badge">HP00000</span>
            </div>
         </div>
         <div class="profile-form">
           <!-- نموذج إكمال البيانات (واتساب، إيميل، الهوية الرسمية) -->
           <div class="aj-block-header" style="margin-top:20px;">
             <span class="aj-crimson-pillar"></span>
             <h3>إكمال ملف الهوية الصحفية</h3>
           </div>
           <div class="form-group">
             <label>رقم الجوال (واتساب) - يسهل تواصل الإدارة معك</label>
             <input type="tel" id="my-whatsapp" class="form-input" placeholder="مثال: +9677...">
           </div>
           <div class="form-group">
             <label>تاريخ الميلاد (من واقع الهوية)</label>
             <input type="date" id="my-dob" class="form-input">
           </div>
           <!-- زر طلب التوثيق -->
           <button type="button" id="request-verification-btn" class="btn-primary" style="margin-top:15px;">طلب توثيق الحساب والشارة الزرقاء</button>
         </div>
       </div>
    </section>

  </main>

  <div id="admin-toast" class="admin-toast hidden"></div>
  
  <script type="module" src="./admin-app.js"></script>
</body>
</html>
